      "name": "Zetronix",
      "url": "https://zetronix.ru",

    <!-- JSON-LD: Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Разработка сайтов и автоматизация бизнес-процессов",
      "provider": { "@type": "Organization", "name": "Zetronix", "url": "https://zetronix.ru" },

        "@type": "OfferCatalog",

        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Лендинг", "description": "Одностраничный сайт на шаблоне, форма заявок в Telegram" }, "priceCurrency": "RUB", "price": "10000" },

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "А я смогу сам менять тексты на сайте?", "acceptedAnswer": { "@type": "Answer", "text": "Да. После запуска мы записываем видеоурок: где поменять текст, фото или цену. Это занимает пару минут и не требует технических знаний." } },
        { "@type": "Question", "name": "Что если мне не понравится результат?", "acceptedAnswer": { "@type": "Answer", "text": "До старта вы видите готовый шаблон вживую. На этапе адаптации показываем промежуточный результат и вносим правки. Если сайт не подойдёт, вернём предоплату за вычетом сделанной работы — прописано в договоре." } },
        { "@type": "Question", "name": "Сайт будет нормально работать на телефоне?", "acceptedAnswer": { "@type": "Answer", "text": "Да, все шаблоны сделаны для телефонов. Проверяем на реальных устройствах: телефон, планшет, компьютер." } },
        { "@type": "Question", "name": "Цена окончательная или будут доплаты?", "acceptedAnswer": { "@type": "Answer", "text": "Цена фиксируется в договоре. Отдельно оплачиваются домен (200-800 ₽/год) и хостинг (200-300 ₽/мес). Никаких скрытых доплат." } },
        { "@type": "Question", "name": "Что нужно от меня для старта?", "acceptedAnswer": { "@type": "Answer", "text": "Три вещи: выбранный шаблон, тексты (можно черновики) и фотографии. Если фото нет, подберём из открытых источников." } },
        { "@type": "Question", "name": "Как я буду получать заявки с сайта?", "acceptedAnswer": { "@type": "Answer", "text": "Все заявки приходят в Telegram за пару секунд: имя, телефон и комментарий. Можно настроить на почту или WhatsApp." } },
        { "@type": "Question", "name": "У меня уже есть домен. Подключите его?", "acceptedAnswer": { "@type": "Answer", "text": "Да. Подключим домен, настроим защищённое соединение. Если домена нет, поможем выбрать и оформить на вас." } }
      ]
    }
    </script>
